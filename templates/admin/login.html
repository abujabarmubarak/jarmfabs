<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | JarmFabs Technologies</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/JarmFabs.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body>
    <div class="admin-login-wrap">
      <div class="login-card">
        <img src="{{ url_for('static', filename='images/JarmFabs.png') }}" alt="JarmFabs" class="login-logo" />
        <h1 class="login-title">JarmFabs Admin</h1>
        <p class="login-sub">Sign in to manage jobs, clients &amp; gallery</p>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div style="margin-bottom: 20px;">
              {% for category, message in messages %}
                <div style="background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 0.86rem; margin-bottom: 8px;">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autofocus />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••••" required />
          </div>

          <button type="submit" class="login-btn">
            Sign In to Dashboard
          </button>
        </form>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--admin-border); font-size: 0.84rem; color: var(--admin-muted);">
          <a href="{{ url_for('index') }}" style="color: var(--admin-primary); font-weight: 500; display: inline-block;">
            &larr; Back to Public Website
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
