{% extends 'admin/base_admin.html' %}

{% block title %}Account Settings | JarmFabs Administration{% endblock %}
{% block page_heading %}Account Security &amp; Credentials{% endblock %}

{% block content %}
<div style="max-width: 680px;">
  <div class="admin-card">
    <div class="admin-card-head">
      <h3>Change Admin Credentials</h3>
    </div>

    <form action="{{ url_for('admin_settings') }}" method="POST" class="admin-form">
      <div class="form-group">
        <label for="username">Admin Username *</label>
        <input type="text" id="username" name="username" value="{{ current_admin.username }}" required />
      </div>

      <div class="form-group">
        <label for="current_password">Current Password *</label>
        <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required />
      </div>

      <hr style="border: none; border-top: 1px solid var(--admin-border); margin: 24px 0;" />

      <div class="form-group">
        <label for="new_password">New Password (leave blank to keep current)</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new strong password" />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" />
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn-action" style="background: var(--admin-primary); color: #fff; padding: 12px 28px; border-radius: 8px; font-size: 0.95rem;">
          Update Credentials
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
